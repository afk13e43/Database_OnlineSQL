name: Daily stock update

# 每日抓台股日線寫進 Azure SQL，並用 GitHub Pages（Actions 部署）更新網站資料
on:
  workflow_dispatch:                 # 可在 Actions 頁手動觸發（測試 / 全量回填）
    inputs:
      backfill:
        description: '全量回填（首次建立或修補歷史時勾選；平常不用）'
        type: boolean
        default: false
  schedule:
    - cron: '0 12 * * 1-5'           # 每週一~五 12:00 UTC = 台灣 20:00（收盤後、資料已穩定）

# 用 Actions 部署 Pages 所需權限（不再 push 回 repo，故不需 contents: write）
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                         # 避免多次部署互相打架
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch & update Azure SQL
        env:
          DB_SERVER:   ${{ secrets.DB_SERVER }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BACKFILL:    ${{ inputs.backfill }}     # 排程觸發時為空字串 → 每日增量模式
        run: python fetch_daily.py

      - name: Build website data (docs/data)
        env:
          DB_SERVER:   ${{ secrets.DB_SERVER }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python build_site.py

      - name: Upload Pages artifact          # 把整個 docs/（網頁 + 剛產生的 data）打包
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
