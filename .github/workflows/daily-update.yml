name: Daily stock update

# 每日抓台股日線寫進 Azure SQL，並重建 GitHub Pages 用的網頁資料（docs/data）
on:
  workflow_dispatch:                 # 可在 Actions 頁手動觸發（測試 / 全量回填）
    inputs:
      backfill:
        description: '全量回填（首次建立或修補歷史時勾選；平常不用）'
        type: boolean
        default: false
  schedule:
    - cron: '0 12 * * 1-5'           # 每週一~五 12:00 UTC = 台灣 20:00（收盤後、資料已穩定）

permissions:
  contents: write                    # 需寫回 docs/data（網頁資料）

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch & update Azure SQL
        env:
          DB_SERVER:   ${{ secrets.DB_SERVER }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BACKFILL:    ${{ inputs.backfill }}     # 排程觸發時為空字串 → 每日增量模式
        run: python fetch_daily.py

      - name: Build website data (docs/data)
        env:
          DB_SERVER:   ${{ secrets.DB_SERVER }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python build_site.py

      - name: Commit refreshed website data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "chore: 更新網站股價資料 ($(date -u +%Y-%m-%d))"
          git push
