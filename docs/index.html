<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小組共用股票資料庫 — 股價趨勢</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header>
  <h1>📈 資料庫實習期末專題　小組股票資料庫</h1>
  <p class="sub">資料每日由 GitHub Actions 從 Azure SQL 自動更新　·　<span id="updated">載入中…</span></p>
</header>

<main>
  <div class="controls">
    <label class="pick">股票
      <select id="stock"></select>
    </label>
    <span id="stat" class="stat"></span>
    <span class="ma-toggles">
      <label class="ma5"><input type="checkbox" data-ma="ma5" checked> MA5</label>
      <label class="ma20"><input type="checkbox" data-ma="ma20" checked> MA20</label>
      <label class="ma60"><input type="checkbox" data-ma="ma60" checked> MA60</label>
      <label class="ma120"><input type="checkbox" data-ma="ma120"> MA120</label>
      <label class="ma240"><input type="checkbox" data-ma="ma240"> MA240</label>
      <label class="bb"><input type="checkbox" id="bb-toggle"> 布林(20,2)</label>
      <label class="vol"><input type="checkbox" id="vol-toggle" checked> 交易量</label>
    </span>
  </div>
  <div id="chart-box">
    <div id="chart"></div>
    <div id="legend"></div>
    <span id="grip" title="拖曳調整圖表大小（置中縮放）"></span>
  </div>
  <div id="years" class="years"></div>
  <div class="slot-ctrl">
    <span class="slot-lbl">圖表訊號：</span>
    <label>K線上方（▼）<select id="slot-top"></select></label>
    <label>K線下方（▲）<select id="slot-bot"></select></label>
  </div>
  <div class="rebal-ctrl">
    <label><input type="checkbox" id="lock-range"> 固定回測區間（勾選後不受縮放圖表影響）</label>
    <label>起 <input type="date" id="rb-start" disabled></label>
    <label>至 <input type="date" id="rb-end" disabled></label>
  </div>
  <div id="rebal" class="rebal"></div>
  <div class="rebal-ctrl">
    <label>葛蘭碧 MA
      <select id="gran-ma">
        <option value="ma5">MA5</option>
        <option value="ma20" selected>MA20</option>
        <option value="ma60">MA60</option>
        <option value="ma120">MA120</option>
        <option value="ma240">MA240</option>
      </select>
    </label>
    <label>容忍天數 <input type="number" id="gran-tol" value="5" min="1" max="10" style="width:46px"></label>
    <label>負乖離 ≤ <input type="number" id="gran-dev-lo" value="-15" step="0.5" style="width:52px">%</label>
    <label>正乖離 ≥ <input type="number" id="gran-dev-hi" value="15" step="0.5" style="width:52px">%</label>
  </div>
  <div id="gran" class="rebal"></div>
  <div class="rebal-ctrl">
    <button id="gran-opt-run" class="btn-run">計算最佳參數（目前範圍）</button>
    <span class="opt-hint">自動試算 MA20/60 × 負乖離 × 正乖離（32 組），挑出區間報酬最高的組合</span>
  </div>
  <div id="gran-opt" class="rebal"></div>
  <p class="hint">紅漲綠跌（台股慣例）　·　拖曳平移看歷史、滾輪縮放、雙擊看全部　·　拖右下角調整大小（置中縮放）　·　下方長條為成交量</p>
</main>

<footer>
  <p>資料來源：yfinance → Azure SQL <code>DatabasePJ.dbo.StockTrading_Live</code>。</p>
</footer>

<script src="app.js"></script>
</body>
</html>
